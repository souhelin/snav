// Top-level build file for the Snav Browser Android application.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def releaseKeystorePath = System.getenv("KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("KEY_ALIAS")
def releaseKeyPassword = System.getenv("KEY_PASSWORD")

def hasReleaseSigning = [
    releaseKeystorePath,
    releaseKeystorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { value -> value != null && !value.trim().isEmpty() }

// AABs cannot share the APK split outputs; isolate their intermediates.
// The normal APK and emulator build directories remain unchanged.
def snavBundle = project.hasProperty('snavBuildBundle')
if (snavBundle) {
    layout.buildDirectory = layout.projectDirectory.dir("build/bundleOnly")
}

def launcherSource = file("src/main/assets/ic_launcher_source.png")
def generatedLauncherRes = layout.buildDirectory.dir("generated/res/launcherIcons").get().asFile

android {
    namespace "io.github.snavprojects.browser"
    compileSdk 37
    buildToolsVersion '36.0.0'

    useLibrary 'org.apache.http.legacy'

    defaultConfig {
        applicationId "io.github.snavprojects.browser"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 1
        versionName "0.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        if (snavBundle) {
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        }
    }

    buildFeatures { compose true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.res.srcDir(generatedLauncherRes)
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    splits {
        abi {
            enable !snavBundle
            reset()
            if (project.hasProperty('snavEmulatorTest')) {
                include 'x86_64'
            } else {
                include 'arm64-v8a', 'armeabi-v7a'
            }
            universalApk false
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Local and CI can assemble an unsigned release to validate R8.
            // Provide all four environment variables to produce a signed APK.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Generate density-specific launcher assets from the original artwork.
// The square crop removes only excess outer padding; the artwork itself is
// never redrawn or stretched. Java ImageIO avoids adding a build dependency.
tasks.register("generateLauncherIcons") {
    inputs.file(launcherSource)
    outputs.dir(generatedLauncherRes)

    doLast {
        if (!launcherSource.exists()) {
            throw new GradleException("Original launcher artwork is missing: ${launcherSource}")
        }

        def source = javax.imageio.ImageIO.read(launcherSource)
        if (source == null || source.width != source.height || source.width < 600) {
            throw new GradleException("Launcher artwork must be a square PNG of at least 600x600 pixels.")
        }

        int cropSize = 600
        int cropLeft = (source.width - cropSize) / 2
        int cropTop = (source.height - cropSize) / 2
        def crop = source.getSubimage(cropLeft, cropTop, cropSize, cropSize)

        def densities = [
            [name: "mdpi", scale: 1, legacy: 48, adaptive: 108],
            [name: "hdpi", scale: 1.5, legacy: 72, adaptive: 162],
            [name: "xhdpi", scale: 2, legacy: 96, adaptive: 216],
            [name: "xxhdpi", scale: 3, legacy: 144, adaptive: 324],
            [name: "xxxhdpi", scale: 4, legacy: 192, adaptive: 432]
        ]

        def resRoot = generatedLauncherRes
        project.delete(resRoot)

        densities.each { density ->
            def mipmapDir = new File(resRoot, "mipmap-${density.name}")
            mipmapDir.mkdirs()

            def legacySize = density.legacy as int
            def legacy = new java.awt.image.BufferedImage(legacySize, legacySize, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            def legacyGraphics = legacy.createGraphics()
            legacyGraphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
            legacyGraphics.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING, java.awt.RenderingHints.VALUE_RENDER_QUALITY)
            legacyGraphics.drawImage(crop, 0, 0, legacySize, legacySize, null)
            legacyGraphics.dispose()
            javax.imageio.ImageIO.write(legacy, "png", new File(mipmapDir, "ic_launcher.png"))

            int adaptiveSize = density.adaptive as int
            int artworkSize = Math.round(60 * (density.scale as double)) as int
            def foreground = new java.awt.image.BufferedImage(adaptiveSize, adaptiveSize, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            def foregroundGraphics = foreground.createGraphics()
            foregroundGraphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
            foregroundGraphics.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING, java.awt.RenderingHints.VALUE_RENDER_QUALITY)
            int offset = (adaptiveSize - artworkSize) / 2
            foregroundGraphics.drawImage(crop, offset, offset, artworkSize, artworkSize, null)
            foregroundGraphics.dispose()
            javax.imageio.ImageIO.write(foreground, "png", new File(mipmapDir, "ic_launcher_foreground.png"))
        }

        // The themed launcher icon uses only the alpha silhouette of the
        // original dark S, not the pale circular background. Keep its size and
        // placement consistent with the existing adaptive foreground.
        def silhouette = new java.awt.image.BufferedImage(cropSize, cropSize, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        for (int y = 0; y < cropSize; y++) {
            for (int x = 0; x < cropSize; x++) {
                int pixel = crop.getRGB(x, y)
                int sourceAlpha = (pixel >>> 24) & 0xff
                int red = (pixel >>> 16) & 0xff
                int green = (pixel >>> 8) & 0xff
                int blue = pixel & 0xff
                int luminance = (red * 2126 + green * 7152 + blue * 722).intdiv(10000)
                int coverage = Math.max(0, Math.min(255, ((185 - luminance) * 255).intdiv(75)))
                int alpha = (sourceAlpha * coverage + 127).intdiv(255)
                silhouette.setRGB(x, y, (alpha << 24) | 0x00ffffff)
            }
        }
        int monochromeSize = 432 // 108 dp at xxxhdpi
        int monochromeArtworkSize = 240 // existing 60 dp foreground placement
        def monochrome = new java.awt.image.BufferedImage(monochromeSize, monochromeSize, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def monochromeGraphics = monochrome.createGraphics()
        monochromeGraphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
        monochromeGraphics.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING, java.awt.RenderingHints.VALUE_RENDER_QUALITY)
        int monochromeOffset = (monochromeSize - monochromeArtworkSize) / 2
        monochromeGraphics.drawImage(silhouette, monochromeOffset, monochromeOffset, monochromeArtworkSize, monochromeArtworkSize, null)
        monochromeGraphics.dispose()
        def monochromeDir = new File(resRoot, "drawable-nodpi")
        monochromeDir.mkdirs()
        javax.imageio.ImageIO.write(monochrome, "png", new File(monochromeDir, "ic_launcher_monochrome.png"))

        def themedAdaptiveDir = new File(resRoot, "mipmap-anydpi-v33")
        themedAdaptiveDir.mkdirs()
        new File(themedAdaptiveDir, "ic_launcher.xml").text = """<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/ic_launcher_background" />
    <foreground android:drawable="@mipmap/ic_launcher_foreground" />
    <monochrome android:drawable="@drawable/ic_launcher_monochrome" />
</adaptive-icon>
"""

        def adaptiveDir = new File(resRoot, "mipmap-anydpi-v26")
        adaptiveDir.mkdirs()
        new File(adaptiveDir, "ic_launcher.xml").text = """<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/ic_launcher_background" />
    <foreground android:drawable="@mipmap/ic_launcher_foreground" />
</adaptive-icon>
"""

        def valuesDir = new File(resRoot, "values")
        valuesDir.mkdirs()
        new File(valuesDir, "ic_launcher_colors.xml").text = """<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="ic_launcher_background">#EDF0F1</color>
</resources>
"""
    }
}

tasks.named("preBuild").configure {
    dependsOn(tasks.named("generateLauncherIcons"))
}

dependencies {
    implementation 'com.google.android.material:material:1.13.0'
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    // Pinned stable GeckoView release; update regularly for engine security fixes.
    implementation 'org.mozilla.geckoview:geckoview:160.0.20261116130455'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
