plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    useLibrary 'org.apache.http.legacy'
    defaultConfig {
        applicationId 'com.snav.browser'
        namespace 'com.snav.browser'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '0.2.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
