name: GeckoView Android build

on:
  push:
    branches:
      - feature/geckoview-engine
  pull_request:
    branches:
      - main
      - feature/geckoview-engine

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android API 37
        run: |
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          android sdk install --canary platforms/android-37 build-tools/36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Assemble release APK with R8
        run: gradle --no-daemon :app:assembleRelease

      - name: Assemble release Android App Bundle
        run: gradle --no-daemon :app:bundleRelease

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snav-geckoview-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
