name: GeckoView Android build

on:
  push:
    branches:
      - feature/geckoview-engine
  pull_request:
    branches:
      - main
      - feature/geckoview-engine

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
