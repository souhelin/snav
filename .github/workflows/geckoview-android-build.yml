name: GeckoView Android build

on:
  push:
    branches:
      - feature/geckoview-engine
      - feature/md3-browser-management
    paths-ignore:
      - '**/*.md'
      - 'README*'
      - 'docs/**'
      - 'LICENSE*'
      - 'NOTICE*'
  pull_request:
    branches:
      - main
      - feature/geckoview-engine
      - feature/md3-modal-translation-reader
    paths-ignore:
      - '**/*.md'
      - 'README*'
      - 'docs/**'
      - 'LICENSE*'
      - 'NOTICE*'

concurrency:
  group: geckoview-android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android API 37
        run: |
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          android sdk install --canary platforms/android-37 build-tools/36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests and assemble debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Assemble release APK with R8
        if: github.event_name == 'workflow_dispatch'
        run: gradle --no-daemon :app:assembleRelease

      - name: Assemble release Android App Bundle
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set +e
          gradle --no-daemon -PsnavBuildBundle=true :app:bundleRelease > "$RUNNER_TEMP/bundle-release.log" 2>&1
          result=$?
          tail -100 "$RUNNER_TEMP/bundle-release.log"
          if [ "$result" -ne 0 ]; then
            message=$(tail -70 "$RUNNER_TEMP/bundle-release.log" | sed 's/%/%25/g' | tr '\n' '|' | cut -c1-12000)
            echo "::error::$message"
          fi
          exit "$result"

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snav-geckoview-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
