name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-release:
    name: Build and sign release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64 secret}"
          : "${KEYSTORE_FILE:?Missing KEYSTORE_FILE secret}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD secret}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS secret}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD secret}"

          case "$KEYSTORE_FILE" in
            */*|*\\*)
              echo "KEYSTORE_FILE must be a file name, not a path."
              exit 1
              ;;
          esac

          KEYSTORE_PATH="$RUNNER_TEMP/$KEYSTORE_FILE"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: snav-browser-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
