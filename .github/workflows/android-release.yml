name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/md3-full-ui-redesign
      - feature/unsplash-wallpaper-pull-refresh
      - feature/geckoview-engine
      - feature/md3-browser-management

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Validate new release signing secrets and decode keystore
        env:
          NEW_KEYSTORE_BASE64: ${{ secrets.NEW_KEYSTORE_BASE64 }}
          NEW_KEYSTORE_PASSWORD: ${{ secrets.NEW_KEYSTORE_PASSWORD }}
          NEW_KEY_ALIAS: ${{ secrets.NEW_KEY_ALIAS }}
          NEW_KEY_PASSWORD: ${{ secrets.NEW_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in NEW_KEYSTORE_BASE64 NEW_KEYSTORE_PASSWORD NEW_KEY_ALIAS NEW_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required new signing secret $name is missing."
              exit 1
            fi
          done

          # Use a fixed temporary filename; no separate filename secret is needed.
          KEYSTORE_PATH="$RUNNER_TEMP/snav-release-v2.jks"
          if ! printf '%s' "$NEW_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"; then
            echo "::error::NEW_KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi

          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$NEW_KEYSTORE_PASSWORD" -alias "$NEW_KEY_ALIAS" >/dev/null
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.NEW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEW_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Add Android SDK Build Tools to PATH
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "::error::Android SDK Build Tools directory not found at $SDK_ROOT/build-tools."
            exit 1
          fi
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in Android SDK Build Tools."
            exit 1
          fi
          echo "$(dirname "$APKSIGNER")" >> "$GITHUB_PATH"
          echo "Using apksigner at $APKSIGNER"

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/release"
          mapfile -d '' APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print0)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No release APKs were generated in $APK_DIR."
            exit 1
          fi
          for APK in "${APKS[@]}"; do
            echo "Verifying $APK"
            apksigner verify --verbose --print-certs "$APK"
          done

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: snav-browser-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 3
