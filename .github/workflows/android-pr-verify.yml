name: Android PR verification
on:
  pull_request:
  push:
    branches:
      - 'arena/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          android sdk install --canary platforms/android-37 build-tools/36.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build and run unit tests
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug > "$RUNNER_TEMP/gradle-check.log" 2>&1
          result=$?
          tail -100 "$RUNNER_TEMP/gradle-check.log"
          if [ "$result" -ne 0 ]; then
            message=$(tail -60 "$RUNNER_TEMP/gradle-check.log" | sed 's/%/%25/g;s//%0D/g' | tr '\n' '|' | cut -c1-12000)
            echo "::error::$message"
          fi
          exit "$result"
